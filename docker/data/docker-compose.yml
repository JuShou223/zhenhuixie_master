networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: "177.7.0.0/16"

services:
  redis:
    image: redis:7.0.0
    container_name: redis
    # 【安全加固】已移除 ports: - 6379:6379 映射，阻断公网直接访问
    privileged: true
    networks:
      network:
        ipv4_address: 177.7.0.10
    volumes:
      - ./redis:/usr/local/etc/redis
      - ./redis/data:/data
    # 【安全加固】增加 --requirepass 参数设置强密码
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "ZhenHuiXie@Redis2026",
      ]

  mysql:
    image: mysql:8.0
    container_name: mysql
    # 【安全加固】已移除 ports: - 3306:3306 映射，阻断公网直接访问
    privileged: true
    networks:
      network:
        ipv4_address: 177.7.0.11
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./mysql/initdb:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: zhenhuixie
      # 【安全加固】修改为复杂密码
      MYSQL_ROOT_PASSWORD: ZhenHuiXie@Mysql2026
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+8:00",
        "--lower-case-table-names=1",
      ]
  java:
    image: eclipse-temurin:17-jre
    container_name: java
    ports:
      - 8080:8080
    privileged: true
    networks:
      network:
        ipv4_address: 177.7.0.13
    depends_on:
      - mysql
      - redis
    volumes:
      - ./java/ruoyi-admin.jar:/server.jar
      - ./java/uploadPath:/uploadPath
      - ./java/logs:/logs
      - /etc/localtime:/etc/localtime
    environment:
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:-ZhenHuiXie@Jwt2026_SecureRandomKey!}
    restart: on-failure
    entrypoint: java -jar /server.jar

  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - 80:80
    privileged: true
    networks:
      network:
        ipv4_address: 177.7.0.14
    depends_on:
      - java
    volumes:
      - ./nginx/h5:/usr/share/nginx/html
      - ./nginx/admin:/usr/share/nginx/admin
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      - ./nginx/logs:/var/log/nginx
      - ./java/uploadPath:/usr/share/nginx/uploadPath
